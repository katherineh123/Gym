config_paths:
  - responses_api_agents/opencode_if_agent/configs/opencode_if_agent.yaml
  - resources_servers/scale_swe/configs/scale_swe.yaml

opencode_if_agent:
  responses_api_agents:
    opencode_if_agent:
      resources_server:
        type: resources_servers
        name: scale_swe_resources_server
      datasets: []

scale_swe_resources_server:
  resources_servers:
    scale_swe:
      allowed_agents: [opencode_sandboxed_agent, opencode_if_agent]

scale_swe_if_environment:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: opencode_if_agent
