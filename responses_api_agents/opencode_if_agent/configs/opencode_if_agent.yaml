config_paths:
  - responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
  - responses_api_models/vllm_model/configs/vllm_model.yaml
  - nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml

use_absolute_ip: true
policy_base_url: https://inference-api.nvidia.com/v1
policy_api_key: ${oc.env:NVIDIA_API_KEY}
policy_model_name: nvidia/zai-org/glm-5.3

opencode_if_agent:
  responses_api_agents:
    _inherit_from: opencode_sandboxed_agent.responses_api_agents
    _delete_key: opencode_sandboxed_agent
    opencode_if_agent:
      _copy: opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent
      num_workers: 1
      token_id_capture: false
      judge:
        endpoint: https://inference-api.nvidia.com/v1/chat/completions
        model: nvidia/zai-org/glm-5.3
        api_key: ${oc.env:NVIDIA_API_KEY}
        max_tokens: 4096
