complex_constraints_resources_server:
  resources_servers:
    complex_constraints:
      entrypoint: app.py
      domain: instruction_following
      verified: false
      description: ComplexConstraints rubric-judged instruction following (one request, many interdependent constraints)
      value: Improve following dense, interdependent constraints from realistic professional requests
      judge_model_server:
        type: responses_api_models
        name: complex_constraints_judge_model
      # The official scorer's judge request: one user message plus the structured-output schema the server adds, and
      # no temperature, token cap or reasoning effort (the provider's defaults).
      judge_chat_completions_create_params:
        messages: []
      # Written by benchmarks/complex_constraints/prepare.py (the official repository carries no license).
      judge_prompt_fpath: benchmarks/complex_constraints/data/complex_constraints_judge_prompt.json
      judge_max_concurrency: 64
      judge_max_attempts: 5

# The official harness's default judge is Gemini 3.5 Flash (github.com/surge-ai/complex-constraints, task.py).
# Set judge_base_url, judge_api_key and judge_model_name in env.yaml or on the command line to use another provider.
complex_constraints_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.select:judge_base_url,https://generativelanguage.googleapis.com/v1beta/openai}
      openai_api_key: ${oc.select:judge_api_key,unset}
      openai_model: ${oc.select:judge_model_name,gemini-3.5-flash}
